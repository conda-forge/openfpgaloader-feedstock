schema_version: 1

context:
  version: "1.2.0"

package:
  name: openfpgaloader
  version: ${{ version }}

source:
  url: https://github.com/trabucayre/openFPGALoader/archive/refs/tags/v${{ version }}.tar.gz
  sha256: f75e9896bd8c6310f98ecd629ed260ecaa83329c31e0f8f831b07531aa64d30a

build:
  number: 0
  skip: not linux

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - pkg-config
    - cmake
    - make
  host:
    - zlib
    - libudev
    - libgpiod
    - libftdi
    - libusb
  run:
    - ${{ pin_compatible("libudev") }}
    - ${{ pin_compatible("libgpiod") }}
    - ${{ pin_compatible("libftdi") }}

tests:
  - script:
      - openFPGALoader --help

about:
  summary: Universal utility for programming FPGA
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/trabucayre/openFPGALoader

extra:
  recipe-maintainers:
    - timkpaine
