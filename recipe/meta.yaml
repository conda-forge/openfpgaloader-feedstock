{% set version = "1.1.1" %}

package:
  name: openfpgaloader
  version: {{ version }}

source:
  url: https://github.com/trabucayre/openFPGALoader/archive/refs/tags/v{{ version }}.tar.gz
  sha256: ca965f933c52a2a9dbb318df4d4de70fac5f095a8e64523f81036ab467a4b567

build:
  number: 0
  skip: true  # [not linux]

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - pkg-config
    - cmake
    - make
  host:
    - zlib
    - libudev
    - libgpiod
    - libftdi
    - libusb
  run:
    - {{ pin_compatible("libudev") }}
    - {{ pin_compatible("libgpiod") }}
    - {{ pin_compatible("libftdi") }}

test:
  commands:
    - openFPGALoader --help

about:
  home: https://github.com/trabucayre/openFPGALoader
  summary: 'Universal utility for programming FPGA'
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - timkpaine
